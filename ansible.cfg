# This ansible.cfg is used only for local testing during development.
# It should not be included into final collection.
[defaults]
# community.general.yaml was removed in community.general 12.0.0 (superseded by
# ansible.builtin.default's own result_format=yaml) -- MEASURED 2026-10-29: the
# unpinned `ansible-galaxy collection install community.general` in integ-test.yml
# now pulls a version past that removal, so every ansible-playbook invocation
# failed outright with "ERROR! [DEPRECATED]: community.general.yaml has been
# removed" before running any task. Hit on the FIRST real run since this
# collection's CI was reconnected to live hosts (2026-10-29) -- host-independent,
# reproduced identically on both https://10.6.112.64 and https://10.6.42.19.
stdout_callback     = default
retry_files_enabled = False
forks               = 16
collections_path = ../../../

[callback_default]
result_format = yaml

---
- environment:
    SC_HOST: "{{ sc_host }}"
    SC_USERNAME: "{{ sc_config[sc_host].sc_username }}"
    SC_PASSWORD: "{{ sc_config[sc_host].sc_password }}"
    SC_TIMEOUT: "{{ sc_timeout }}"

  block:
    - name: Delete the VM with name vm-integration-test-disks, if it exists from before
      scale_computing.hypercore.vm: &vm-delete
        vm_name: vm-integration-test-disks
        state: absent
        memory: 536870912
        vcpu: 2
      register: result

    - name: Create VM vm-integration-test-disks on which we'll build our block devices on
      scale_computing.hypercore.vm:
        vm_name: vm-integration-test-disks
        description: Demo VM
        tags:
          - "Integration test"
        memory: 536870912
        vcpu: 2
        power_state: shutdown
        state: present
        disks: [ ]
        nics: [ ]
        machine_type: BIOS
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is changed

    - &vminfo
      name: Get VM vm-integration-test-disks info
      scale_computing.hypercore.vm_info:
        vm_name: vm-integration-test-disks
      register: vminfo
    - &check_vminfo_nodisk
      ansible.builtin.assert:
        that:
          - vminfo.records.0.disks == []

    - name: Create virtio disk in slot 0 with 5GB space
      scale_computing.hypercore.vm_disk: &create-virtio-disk
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 0
            type: virtio_disk
            size: "{{ '5 GB' | human_to_bytes }}"
        state: present
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is changed
          - result.record | length == 1
          - result.record.0.type == "virtio_disk"
          - result.record.0.disk_slot == 0
          - result.record.0.size == 5368709120
          - result.record.0.iso_name == ""
          - result.record.0.tiering_priority_factor == 4
          - result.record.0.cache_mode == "none"
          - result.record.0.disable_snapshotting == false
    - *vminfo
    - &check_vminfo_5gb
      ansible.builtin.assert:
        that:
          - vminfo.records.0.disks | length == 1
          - vminfo.records.0.disks.0.type == "virtio_disk"
          - vminfo.records.0.disks.0.disk_slot == 0
          - vminfo.records.0.disks.0.size == 5368709120
          - vminfo.records.0.disks.0.iso_name == ""
          - vminfo.records.0.disks.0.tiering_priority_factor == 4
          - vminfo.records.0.disks.0.cache_mode == "none"
          - vminfo.records.0.disks.0.disable_snapshotting == false

    - name: Create virtio disk in slot 0 with 5GB space (test idempotence)
      scale_computing.hypercore.vm_disk: *create-virtio-disk
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is not changed
    - *vminfo
    - *check_vminfo_5gb

    - name: Resize the disk to 10GB
      scale_computing.hypercore.vm_disk: &resize-disk
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 0
            type: virtio_disk
            size: "{{ '10 GB' | human_to_bytes }}"
        state: present
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is changed
          - result.record | length == 1
          - result.record.0.type == "virtio_disk"
          - result.record.0.disk_slot == 0
          - result.record.0.size == 10737418240
          - result.record.0.iso_name == ""
          - result.record.0.tiering_priority_factor == 4
          - result.record.0.cache_mode == "none"
          - result.record.0.disable_snapshotting == false
    - *vminfo
    - &check_vminfo_10gb
      ansible.builtin.assert:
        that:
          - vminfo.records.0.disks | length == 1
          - vminfo.records.0.disks.0.type == "virtio_disk"
          - vminfo.records.0.disks.0.disk_slot == 0
          - vminfo.records.0.disks.0.size == 10737418240
          - vminfo.records.0.disks.0.iso_name == ""
          - vminfo.records.0.disks.0.tiering_priority_factor == 4
          - vminfo.records.0.disks.0.cache_mode == "none"
          - vminfo.records.0.disks.0.disable_snapshotting == false

    - name: Resize the disk to 10GB (idempotence)
      scale_computing.hypercore.vm_disk: *resize-disk
      register: result
    - ansible.builtin.assert:
        that:
          - result is not changed
    - *vminfo
    - *check_vminfo_10gb

    - name: Update existing disk - resize, change type of the disk and cache_mode
      scale_computing.hypercore.vm_disk:
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 0
            type_new: ide_disk
            type: virtio_disk
            size: "{{ '11.1 GB' | human_to_bytes }}"
            cache_mode: writeback
        state: present
      register: result
    - ansible.builtin.assert:
        that:
          # Note that in case of adding CD-ROM on slot 0, API would automatically move IDE disk to slot 1 -
          # slot would change automatically. In that case, module is NOT idempotent.
          # To get this idempotency, disk_slot_new would also have to be added
          - result is succeeded
          - result is changed
          - result.record | length == 1
          - result.record.0.type == "ide_disk"
          - result.record.0.disk_slot == 0
          - result.record.0.size == 11918534246
          - result.record.0.iso_name == ""
          - result.record.0.tiering_priority_factor == 4
          - result.record.0.cache_mode == "writeback"
          - result.record.0.disable_snapshotting == false
    - *vminfo
    - &check_vminfo_ide10gb
      ansible.builtin.assert:
        that:
          - vminfo.records.0.disks | length == 1
          - vminfo.records.0.disks.0.type == "ide_disk"
          - vminfo.records.0.disks.0.disk_slot == 0
          - vminfo.records.0.disks.0.size == 11918534246
          - vminfo.records.0.disks.0.iso_name == ""
          - vminfo.records.0.disks.0.tiering_priority_factor == 4
          - vminfo.records.0.disks.0.cache_mode == "writeback"
          - vminfo.records.0.disks.0.disable_snapshotting == false

    - name: Remove the previously updated disk
      scale_computing.hypercore.vm_disk:
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 0
            type: ide_disk
        state: absent
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is changed
          - result.record | length == 0
    - *vminfo
    - *check_vminfo_nodisk

    # The file should be already created by prepare_iso.yml
    - name: Get integration-test.iso info
      scale_computing.hypercore.iso_info:
        name: "integration-test.iso"
      register: uploaded_iso_info
    - ansible.builtin.assert:
        that:
          - uploaded_iso_info.records | length == 1
          - uploaded_iso_info.records.0.size == 356352

    - name: Get integration-test-disk.iso info
      scale_computing.hypercore.iso_info:
        name: "integration-test-disk.iso"
      register: uploaded_iso_info
    - ansible.builtin.assert:
        that:
          - uploaded_iso_info.records | length == 1
          - uploaded_iso_info.records.0.size == 356352

    - name: Attach integration-test-disk.iso ISO onto the current CD-ROM device
      scale_computing.hypercore.vm_disk: &create-cdrom-disk
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 0
            type: ide_cdrom
            iso_name: "integration-test-disk.iso"
        state: present
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is changed
          - result.record.0.type == "ide_cdrom"
          - result.record.0.disk_slot == 0
          - result.record.0.iso_name == "integration-test-disk.iso"
    - *vminfo
    - &check_vminfo_cdromfull
      ansible.builtin.assert:
        that:
          - vminfo.records.0.disks | length == 1
          - vminfo.records.0.disks.0.type == "ide_cdrom"
          - vminfo.records.0.disks.0.disk_slot == 0
          - vminfo.records.0.disks.0.size == 356352
          - vminfo.records.0.disks.0.iso_name == "integration-test-disk.iso"
          - vminfo.records.0.disks.0.tiering_priority_factor == 4
          - vminfo.records.0.disks.0.cache_mode == "none"
          - vminfo.records.0.disks.0.disable_snapshotting == false

    - name: Assert that ISO image is mounted on vm-integration-test-disks
      scale_computing.hypercore.iso_info:
        name: integration-test-disk.iso
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is not changed
          - result.records.0.mounts.0.vm_name == "vm-integration-test-disks"

    - name: Detach ISO image from the disk and delete the CD-ROM
      scale_computing.hypercore.vm_disk:
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 0
            type: ide_cdrom
        state: absent
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is changed
          - result.record == []
    - *vminfo
    - *check_vminfo_nodisk

    - name: Assert that ISO image isn't mounted on vm-integration-test-disks anymore
      scale_computing.hypercore.iso_info:
        name: integration-test-disk.iso
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is not changed
          - result.records.0.mounts == []

    - name: Remove all previous disks and set new virtio disk with 5 GB space in slot 1
      scale_computing.hypercore.vm_disk:
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 1
            type: virtio_disk
            size: "{{ '5 GB' | human_to_bytes }}"
        state: set
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is changed
          - result.record | length == 1
          - result.record.0.type == "virtio_disk"
          - result.record.0.disk_slot == 1
          - result.record.0.size == 5368709120
          - result.record.0.iso_name == ""
          - result.record.0.tiering_priority_factor == 4
          - result.record.0.cache_mode == "none"
          - result.record.0.disable_snapshotting == false
    - *vminfo
    - &check_vminfo_virtio_5gb_s1
      ansible.builtin.assert:
        that:
          - vminfo.records.0.disks | length == 1
          - vminfo.records.0.disks.0.type == "virtio_disk"
          - vminfo.records.0.disks.0.disk_slot == 1
          - vminfo.records.0.disks.0.size == 5368709120
          - vminfo.records.0.disks.0.iso_name == ""
          - vminfo.records.0.disks.0.tiering_priority_factor == 4
          - vminfo.records.0.disks.0.cache_mode == "none"
          - vminfo.records.0.disks.0.disable_snapshotting == false

    - name: Set empty CD-ROM
      scale_computing.hypercore.vm_disk:
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 0
            type: ide_cdrom
            iso_name: ""
        state: set
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is changed
          - result.record | length == 1
          - result.record.0.type == "ide_cdrom"
          - result.record.0.disk_slot == 0
          - result.record.0.size == 0  # size is always 0 when creating CD-ROM
          - result.record.0.iso_name == ""
    - *vminfo
    - &check_vminfo_cdempty
      ansible.builtin.assert:
        that:
          - vminfo.records.0.disks | length == 1
          - vminfo.records.0.disks.0.type == "ide_cdrom"
          - vminfo.records.0.disks.0.disk_slot == 0
          - vminfo.records.0.disks.0.size == 0
          - vminfo.records.0.disks.0.iso_name == ""
          - vminfo.records.0.disks.0.tiering_priority_factor == 4
          - vminfo.records.0.disks.0.cache_mode == "none"
          - vminfo.records.0.disks.0.disable_snapshotting == false

    - name: Force remove all disks
      scale_computing.hypercore.vm_disk:
        vm_name: vm-integration-test-disks
        items: [ ]
        state: set
        force: True
      register: result
    - ansible.builtin.assert:
        that:
          - result is succeeded
          - result is changed
          - result.record == []
    - *vminfo
    - *check_vminfo_nodisk

# =========================================================================================
# Regression coverage for #30 - a NON-DEFAULT tiering_priority_factor must be applied on the
# FIRST pass, at disk-creation time.
#
# Every other tiering_priority_factor assertion in this file checks the DEFAULT (4), so none of
# them can detect the #30 behaviour: HyperCore used to ignore tieringPriorityFactor in a disk
# CREATE request and silently force the default, which made the module non-idempotent and needed
# a second pass to take effect (internal Scale REST issue 5143).
#
# That was fixed on the HyperCore side - the collection never carried a workaround - so these
# assertions pass on 9.7.7. They exist to catch a re-regression, in either direction.
# The VM has no disks at this point, so this creates its own and cleans up after itself.
# =========================================================================================

    - name: "#30 - create disk with a non-default tiering_priority_factor in ONE pass"
      scale_computing.hypercore.vm_disk:
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 0
            type: virtio_disk
            size: "{{ '1 GB' | human_to_bytes }}"
            tiering_priority_factor: 8
        state: present
      register: tiering_first_pass
    - name: "#30 - non-default tiering must be set on the first pass, not the second"
      ansible.builtin.assert:
        that:
          - tiering_first_pass is succeeded
          - tiering_first_pass is changed
          - tiering_first_pass.record.0.tiering_priority_factor == 8
        fail_msg: >-
          tiering_priority_factor was not applied when the disk was created.
          Wanted 8, got {{ tiering_first_pass.record.0.tiering_priority_factor | default('unset') }}.
          This is a regression of #30 - HyperCore ignoring tieringPriorityFactor on disk create.

    - name: "#30 - confirm via vm_info that it persisted"
      scale_computing.hypercore.vm_info:
        vm_name: vm-integration-test-disks
      register: tiering_vminfo
    - ansible.builtin.assert:
        that:
          - tiering_vminfo.records.0.disks.0.tiering_priority_factor == 8

    - name: "#30 - repeating the same task must be idempotent"
      scale_computing.hypercore.vm_disk:
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 0
            type: virtio_disk
            size: "{{ '1 GB' | human_to_bytes }}"
            tiering_priority_factor: 8
        state: present
      register: tiering_second_pass
    - ansible.builtin.assert:
        that:
          - tiering_second_pass is succeeded
          - tiering_second_pass is not changed
        fail_msg: >-
          Second pass reported changed={{ tiering_second_pass.changed }}. If the first pass had
          applied tiering correctly this should be a no-op - a changed=true here is the original
          #30 symptom.

    - name: "#30 - changing tiering_priority_factor on an EXISTING disk"
      scale_computing.hypercore.vm_disk:
        vm_name: vm-integration-test-disks
        items:
          - disk_slot: 0
            type: virtio_disk
            size: "{{ '1 GB' | human_to_bytes }}"
            tiering_priority_factor: 3
        state: present
      register: tiering_change
    - ansible.builtin.assert:
        that:
          - tiering_change is changed

    # NOTE (observed on 9.7.7.226383): unlike the create path above, changing tiering on an
    # EXISTING disk is NOT reflected in a GET straight away. The module returns changed=true but
    # its own `record` still carries the OLD factor, and vm_info agrees, for a few seconds.
    # It settles to the requested value well within 60s. So this is a read-after-write
    # propagation lag on the change path, distinct from #30 (which was create ignoring the value
    # outright and forcing the default). Hence the retry here rather than a bare assert - a bare
    # assert immediately after the change WILL fail intermittently.
    - name: "#30 - the changed value must land (allowing for read-after-write lag)"
      scale_computing.hypercore.vm_info:
        vm_name: vm-integration-test-disks
      register: tiering_vminfo_changed
      retries: 12
      delay: 5
      until: tiering_vminfo_changed.records.0.disks.0.tiering_priority_factor == 3
    - ansible.builtin.assert:
        that:
          - tiering_vminfo_changed.records.0.disks.0.tiering_priority_factor == 3

    - name: "#30 - clean up the tiering test disk"
      scale_computing.hypercore.vm_disk:
        vm_name: vm-integration-test-disks
        items: [ ]
        state: set
        force: True
# =========================================================================================

    - name: Delete the VM on which the tests were performed
      scale_computing.hypercore.vm: *vm-delete
      register: result
